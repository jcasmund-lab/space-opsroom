name: Collect Space Ops Data

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, deliberately offset from the top/bottom of the hour.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install collector dependencies
        run: pip install -r requirements-collector.txt

      - name: Collect public data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector.py
